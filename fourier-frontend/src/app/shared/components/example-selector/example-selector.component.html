<div class="flex flex-col gap-1.5">
  <label
    class="text-xs font-semibold font-mono text-muted dark:text-dark-muted uppercase tracking-wider"
  >
    {{ label() }}
  </label>
  <select
    (change)="onChange($event)"
    class="w-full px-3 py-2 rounded border border-border dark:border-dark-border bg-paper dark:bg-dark-bg text-xs font-mono text-muted dark:text-dark-muted focus:outline-none focus:ring-1 focus:ring-accent cursor-pointer"
  >
    <option value="" disabled selected>{{ placeholder() }}</option>
    @for (opt of options(); track opt.id) {
      <option [value]="opt.id">{{ opt.labelKey | transloco }}</option>
    }
  </select>
</div>

@if (visible()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    (click)="cancel()"
    (keydown.escape)="cancel()"
  >
    <div
      class="bg-paper dark:bg-dark-surface border border-border dark:border-dark-border rounded-xl shadow-2xl w-full max-w-sm p-5"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
          </svg>
          <h3 class="text-sm font-semibold text-ink dark:text-dark-ink font-body">
            {{ 'history.favorite.add' | transloco }}
          </h3>
        </div>
        <button
          type="button"
          (click)="cancel()"
          class="w-7 h-7 flex items-center justify-center rounded text-muted dark:text-dark-muted hover:bg-paper2 dark:hover:bg-dark-surface2 hover:text-ink dark:hover:text-dark-ink transition-colors text-lg leading-none cursor-pointer"
        >×</button>
      </div>

      <label class="block text-xs font-mono text-muted dark:text-dark-muted mb-1.5">
        {{ 'history.favorite.nameLabel' | transloco }}
      </label>
      <input
        type="text"
        [(ngModel)]="name"
        [placeholder]="'history.favorite.namePlaceholder' | transloco"
        (keydown.enter)="confirm()"
        (keydown.escape)="cancel()"
        autofocus
        class="w-full px-2.5 py-2 text-sm rounded border border-border dark:border-dark-border bg-paper2 dark:bg-dark-bg text-ink dark:text-dark-ink outline-none focus:border-accent"
      />

      <div class="flex gap-2 mt-4">
        <button
          type="button"
          (click)="confirm()"
          class="flex-1 px-3 py-2 text-xs font-mono rounded bg-accent text-white hover:bg-accent/90 transition-colors cursor-pointer"
        >{{ 'common.save' | transloco }}</button>
        <button
          type="button"
          (click)="cancel()"
          class="px-3 py-2 text-xs font-mono rounded border border-border dark:border-dark-border text-muted dark:text-dark-muted hover:text-ink dark:hover:text-dark-ink transition-colors cursor-pointer"
        >{{ 'common.cancel' | transloco }}</button>
      </div>
    </div>
  </div>
}

<div class="min-h-screen flex flex-col bg-paper dark:bg-dark-bg">
  <app-nav />

  <!-- ── Page header ───────────────────────────────────────────────────────── -->
  <header class="shrink-0 border-b border-border dark:border-dark-border px-6 py-4">
    <h1 class="font-display text-2xl text-ink dark:text-dark-ink">
      {{ 'calculator.title' | transloco }}
    </h1>
    <p class="text-sm text-muted dark:text-dark-muted font-body mt-0.5">
      {{ 'calculator.subtitle' | transloco }}
    </p>
  </header>

  <!-- ── Two-panel layout ──────────────────────────────────────────────────── -->
  <div class="flex flex-col lg:flex-row flex-1 min-h-0">
    <!-- Left panel: form -->
    <aside
      class="w-full lg:w-96 xl:w-105 shrink-0 border-b lg:border-b-0 lg:border-r border-border dark:border-dark-border overflow-y-auto"
    >
      <div class="p-5">
        <app-calculator-form />
      </div>
    </aside>

    <!-- Right panel: canvas + results -->
    <main class="flex-1 min-h-0 overflow-y-auto flex flex-col">
      <div class="p-5 flex flex-col gap-5 flex-1 min-h-0">
        <app-results-summary class="flex-1 min-h-0" />

        @if (hasResult()) {
          <a [routerLink]="'/' + lang() + '/grapher'"
            class="flex items-center justify-between gap-3 px-4 py-3 rounded-lg border border-border dark:border-dark-border bg-paper2 dark:bg-dark-surface hover:border-accent dark:hover:border-accent transition-colors group">
            <div class="flex items-center gap-2.5">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-accent shrink-0" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
              <span class="text-xs font-mono text-muted dark:text-dark-muted group-hover:text-ink dark:group-hover:text-dark-ink transition-colors">
                {{ 'common.grapherBanner' | transloco }}
              </span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-accent shrink-0" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </a>
        }
      </div>
    </main>
  </div>
</div>

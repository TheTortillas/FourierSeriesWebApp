<app-nav />

<div class="flex h-[calc(100vh-3rem)]">

  <!-- Sidebar -->
  <aside class="flex flex-col w-72 shrink-0 border-r border-border dark:border-dark-border bg-paper dark:bg-dark-bg overflow-y-auto">

    <!-- Expression list -->
    <div class="flex-1">
      @for (expr of expressions(); track expr.id) {
        <app-grapher-expression
          [expr]="expr"
          [isOnly]="expressions().length === 1"
          (changed)="updateExpression($event)"
          (removed)="removeExpression($event)"
        />
      }
    </div>

    <!-- Add expression button -->
    <div class="p-3 border-t border-border dark:border-dark-border">
      <button
        type="button"
        (click)="addExpression()"
        class="w-full flex items-center justify-center gap-1.5 px-3 py-1.5 rounded border border-dashed border-border dark:border-dark-border text-xs font-mono text-muted dark:text-dark-muted hover:text-ink dark:hover:text-dark-ink hover:border-accent transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add expression
      </button>
    </div>

    <!-- Parameter sliders -->
    @if (detectedParams().length > 0) {
      <div class="p-3 border-t border-border dark:border-dark-border">
        <app-param-sliders
          [params]="detectedParams()"
          (valuesChange)="onParamChange($event)"
        />
      </div>
    }

  </aside>

  <!-- Canvas area -->
  <main class="relative flex-1 min-w-0">

    <app-function-plot
      class="block w-full h-full"
      [layers]="layers()"
      [initialUnit]="80"
      (mathPointerMove)="onPointerMove($event)"
      (viewportChange)="onViewportChange($event)"
    />

    <!-- Hover coordinate display -->
    @if (hoveredPoint()) {
      <div class="absolute top-3 left-3 px-2 py-1 rounded font-mono text-xs bg-paper/80 dark:bg-dark-bg/80 text-muted dark:text-dark-muted border border-border dark:border-dark-border pointer-events-none backdrop-blur-sm">
        x = {{ hoveredPoint()!.x | number:'1.3-3' }}&nbsp;&nbsp;y = {{ hoveredPoint()!.y | number:'1.3-3' }}
      </div>
    }

  </main>

</div>
